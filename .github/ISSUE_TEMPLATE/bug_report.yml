name: Bug Report
description: Create a report to help us fix an issue or improve trap detection.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue with Agent Janitor!
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Python version, Git version
      placeholder: e.g. Windows 11, Python 3.12, Git 2.45
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Code Snippet / Reproduction
      description: Provide the comment or code snippet that triggered the false positive or issue.
      render: python
