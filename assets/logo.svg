<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="url(#cyanPurple)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Background Glow Orb -->
  <circle cx="256" cy="240" r="140" fill="#6366f1" opacity="0.15" filter="url(#intenseGlow)" />

  <!-- Shield Base (Protection / Security) -->
  <path d="M 256 90 
           C 335 125, 395 125, 410 140 
           C 410 260, 350 360, 256 422 
           C 162 360, 102 260, 102 140 
           C 117 125, 177 125, 256 90 Z"
        fill="url(#shieldFill)" 
        stroke="url(#shieldBorder)" 
        stroke-width="5" />

  <!-- Inner Circuit / Geometric Lines -->
  <path d="M 256 125 L 256 385" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" stroke-opacity="0.3" />
  <path d="M 150 210 L 362 210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,8" stroke-opacity="0.25" />

  <!-- Stylized Janitor Broom & Digital Beam (Diagonal) -->
  <!-- Broom Handle (Cyber Wand) -->
  <line x1="335" y1="145" x2="235" y2="265" stroke="url(#cyanPurple)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)" />
  <line x1="335" y1="145" x2="235" y2="265" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Handle Grip Nodes -->
  <circle cx="335" cy="145" r="9" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="335" cy="145" r="4" fill="#ffffff" />
  <circle cx="285" cy="205" r="6" fill="#818cf8" />

  <!-- Broom Head & Bristles (Sweeping Light Wave) -->
  <!-- Base Cap -->
  <path d="M 205 250 L 265 295 L 250 315 L 190 270 Z" fill="url(#cyanPurple)" />

  <!-- Bristle Flares / Energy Sweeper -->
  <path d="M 190 270 
           C 165 315, 145 350, 135 365
           C 175 362, 220 348, 250 315 
           Z" 
        fill="url(#cyanPurple)" 
        filter="url(#neonGlow)" />

  <path d="M 175 285 L 125 360" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <path d="M 195 295 L 155 365" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 215 305 L 185 365" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
  <path d="M 235 315 L 215 360" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />

  <!-- Swept Clean Particles / Sparkles (Right Side) -->
  <!-- Sparkle 1 -->
  <path d="M 320 270 Q 320 285 335 285 Q 320 285 320 300 Q 320 285 305 285 Q 320 285 320 270 Z" fill="#38bdf8" filter="url(#neonGlow)" />
  <!-- Sparkle 2 -->
  <path d="M 370 215 Q 370 226 381 226 Q 370 226 370 237 Q 370 226 359 226 Q 370 226 370 215 Z" fill="#c084fc" filter="url(#neonGlow)" />
  <!-- Sparkle 3 -->
  <circle cx="280" cy="350" r="5" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="350" cy="330" r="3.5" fill="#818cf8" />
  <circle cx="160" cy="180" r="4" fill="#38bdf8" opacity="0.6" />

  <!-- Code Clean Brackets Motif { / } in Background -->
  <text x="145" y="270" font-family="monospace" font-size="34" font-weight="bold" fill="#38bdf8" fill-opacity="0.25">&lt;/&gt;</text>
</svg>
