<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="metric-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="metric-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- Terminal Header Dots -->
  <circle cx="36" cy="36" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="36" r="7" fill="#ffbd2e"/>
  <circle cx="80" cy="36" r="7" fill="#27c93f"/>

  <!-- Title Badge -->
  <text x="120" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" font-weight="600">agent-janitor // eliminate agent distraction traps</text>

  <!-- Main Headline -->
  <text x="60" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Stop AI Coding Agents From
  </text>
  <text x="60" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accent)" letter-spacing="-1" filter="url(#glow)">
    Side-Questing Down Stale TODOs
  </text>

  <text x="60" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#8b949e" font-weight="400">
    Based on empirical research by Google (Nov 2026). Prunes closed bug traps, prevents scope creep, and saves 77% tokens.
  </text>

  <!-- Stat Cards -->
  <!-- Card 1 -->
  <rect x="60" y="255" width="250" height="110" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="80" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e" font-weight="600">UNPROMPTED ACTIONS</text>
  <text x="80" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="url(#metric-red)">83%</text>
  <text x="175" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">eliminated</text>

  <!-- Card 2 -->
  <rect x="335" y="255" width="250" height="110" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="355" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e" font-weight="600">STEPS SAVED</text>
  <text x="355" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="url(#metric-green)">-41%</text>
  <text x="470" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">per session</text>

  <!-- Card 3 -->
  <rect x="610" y="255" width="250" height="110" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="630" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e" font-weight="600">TOKENS SAVED</text>
  <text x="630" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="url(#metric-green)">-44%</text>
  <text x="745" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">token inflation</text>

  <!-- Card 4 -->
  <rect x="885" y="255" width="250" height="110" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="905" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e" font-weight="600">LATENCY REDUCTION</text>
  <text x="905" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="url(#metric-green)">-51%</text>
  <text x="1020" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">wait time</text>

  <!-- Ecosystem Badges in Corner -->
  <rect x="940" y="25" width="200" height="32" rx="16" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="1040" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#e5e7eb" font-weight="600" text-anchor="middle">Claude • Cursor • Antigravity</text>
</svg>
