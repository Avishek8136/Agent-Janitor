repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: agent-distraction-check
        name: Agent Distraction Presubmit Check
        entry: agent-janitor check .
        language: system
        pass_filenames: false
        always_run: true
